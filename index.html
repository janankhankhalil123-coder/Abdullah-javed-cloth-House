<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdullah Javed Cloth House</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;scroll-behavior:smooth;}
body{background:#f5f5f5;color:#222;}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:#111;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
  animation:fadeDown 0.8s ease;
}
nav h2{font-size:20px;}
nav ul{display:flex;gap:20px;list-style:none;}
nav ul li{cursor:pointer;transition:0.3s;}
nav ul li:hover{color:#ffcc00;}

header{
  background:linear-gradient(135deg,#000,#333);
  color:white;
  padding:60px 20px;
  text-align:center;
  animation:fadeDown 1s ease-in-out;
}
header h1{font-size:40px;}
header p{margin-top:10px;opacity:0.8;}

@keyframes fadeDown{
  from{opacity:0;transform:translateY(-30px);} 
  to{opacity:1;transform:translateY(0);} 
}

.container{padding:40px;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
  transition:0.4s;
  animation:fadeUp 0.8s ease;
}
.card:hover{
  transform:translateY(-10px) scale(1.03);
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px);} 
  to{opacity:1;transform:translateY(0);} 
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card-content{padding:15px;}

.price{
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
}

input{
  width:100%;
  padding:8px;
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:6px;
}

button{
  background:#111;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
  margin-top:10px;
  width:100%;
}
button:hover{background:#ffcc00;color:#000;}

.checkout{
  display:block;
  margin:40px auto;
  padding:15px 30px;
  font-size:18px;
  width:250px;
}

footer{
  background:#111;
  color:white;
  padding:25px;
  text-align:center;
  margin-top:40px;
}

/* HERO */
.hero{
  text-align:center;
  padding:40px;
  background:#fff;
}
.hero h2{font-size:28px;margin-bottom:10px;}
.hero p{opacity:0.7;}

</style></head>
<body><nav>
  <h2>AJ Cloth House</h2>
  <ul>
    <li onclick="window.scrollTo(0,0)">Home</li>
    <li onclick="document.getElementById('shop').scrollIntoView()">Shop</li>
    <li onclick="document.getElementById('contact').scrollIntoView()">Contact</li>
  </ul>
</nav><header>
  <h1>Abdullah Javed Cloth House</h1>
  <p>Premium Clothing | Best Prices | Peshawar</p>
</header><div class="hero">
  <h2>New Arrival Collection 2026</h2>
  <p>Elegant, Casual & Wedding Dresses Available</p>
</div><div class="container" id="shop">
  <h2 style="text-align:center;margin-bottom:20px;">Our Collection</h2>
  <div class="grid" id="productGrid"></div><button class="checkout" onclick="checkout()">Order via WhatsApp</button>

</div><footer id="contact">
  <p>📍 Address: Bakhshi Pul, New Ghari, Peshawar</p>
  <p>📞 Contact / Helpline: 0314 9232978</p>
</footer><script>
let products = [
  {name:"Elegant Suit", price:2500, image:"https://images.unsplash.com/photo-1603252109303-2751441dd157"},
  {name:"Casual Wear", price:1800, image:"https://images.unsplash.com/photo-1521334884684-d80222895322"},
  {name:"Wedding Dress", price:5000, image:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f"}
];

let cart = [];

function renderProducts(){
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';

  products.forEach((p, index) => {
    grid.innerHTML += `
      <div class="card">
        <img src="${p.image}" alt="cloth">
        <div class="card-content">
          <h3>${p.name}</h3>
          <input type="number" value="${p.price}" onchange="updatePrice(${index}, this.value)">
          <p class="price">PKR ${p.price}</p>
          <button onclick="addToCart(${index})">Add to Cart</button>
        </div>
      </div>
    `;
  });
}

function updatePrice(index, value){
  products[index].price = Number(value);
  renderProducts();
}

function addToCart(index){
  cart.push(products[index]);
  alert('Added to cart ✔');
}

function checkout(){
  if(cart.length === 0){
    alert('Cart is empty');
    return;
  }

  let message = 'Order Details:%0A';
  let total = 0;

  cart.forEach(p => {
    message += `${p.name} - PKR ${p.price}%0A`;
    total += p.price;
  });

  message += `Total: PKR ${total}`;

  window.open(`https://wa.me/923149232978?text=${message}`, '_blank');
}

renderProducts();
</script></body>
</html>
